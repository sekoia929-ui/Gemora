name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       medpipeline
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medpipeline
          PYTHONPATH: .
        run: pytest src/tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t med-pipeline-backend:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL=postgresql://noop:noop@noop:5432/noop \
            -p 8001:8000 \
            med-pipeline-backend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8001/health || (docker logs smoke && exit 1)
          docker stop smoke
